; File: platformio.ini
[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = 
    pre:scripts/enable_ccache.py
    pre:scripts/get_version.py
    pre:scripts/web_embedder.py
    pre:scripts/build_effects.py
    pre:scripts/smart_backend.py
    post:scripts/stats.py
    post:scripts/collect_firmware.py

lib_deps =
    esp32async/ESPAsyncWebServer @ 3.9.6
    bblanchon/ArduinoJson @ 7.4.0
    etlcpp/Embedded Template Library @ 20.44.2

build_flags =
    -std=gnu++17
    -DAPP_NAME=\"Hyperk\"
    -DPIO_ENV_NAME=\"${PIOENV}\"
    -DMAX_LEDS=2000
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=0
    ; -DENABLE_DEBUG ; enable debug log to serial port

build_unflags =
    -std=gnu++11

; =========================================================
; ESP32 and S2, S3, C2, C3, C5, C6 (SDK > 5.x)
; =========================================================

[end:esp32-enable-cdc]
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

[env:modern-esp]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39

board_build.partitions = partitions_4mb.csv
board_build.flash_mode = dio
framework = arduino

build_flags = 
    ${env.build_flags}
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096
    -DUSE_ASYNC_WEBSERWER=1

lib_ignore = 
    RPAsyncTCP
    ESPAsyncTCP

;----------------------------------------------------------

[env:multi-esp32-led-strip]
extends = env:modern-esp

lib_deps =
    ${env:modern-esp.lib_deps}
    led_strip=https://github.com/awawa-dev/esp-led-strip-async.git

build_flags = 
    ${env:modern-esp.build_flags}
    -DUSE_MULTI_ESP32_LED_STRIP
    -I.pio/libdeps/$PIOENV/led_strip/include
    -I.pio/libdeps/$PIOENV/led_strip/src
    -I.pio/libdeps/$PIOENV/led_strip/interface 

; =====
; ESP32
; =====

[env:esp32]
extends = env:multi-esp32-led-strip
board = esp32dev

; ===========
; ESP32-ETH01
; ===========

[env:esp32-eth01]
extends = env:multi-esp32-led-strip
board = wt32-eth01

build_flags = 
    ${env:esp32.build_flags}
    -DWEBSERVER_USE_ETHERNET=1
    -DETH_PHY_TYPE=ETH_PHY_LAN8720
    -DETH_PHY_ADDR=1
    -DETH_PHY_MDC=23
    -DETH_PHY_MDIO=18
    -DETH_CLK_MODE=ETH_CLOCK_GPIO0_IN

; ========
; ESP32-S2
; ========

[env:esp32s2]
extends = env:multi-esp32-led-strip
board = esp32-s2-saola-1
lib_deps =
    ${env:multi-esp32-led-strip.lib_deps}
    https://github.com/hathach/tinyusb.git#0.20.0
build_flags = 
    ${env:multi-esp32-led-strip.build_flags}
    ${end:esp32-enable-cdc.build_flags}
    -DUSE_SYNC_WEBSERWER=1
    "-DCFG_TUSB_CONFIG_FILE=\"${PROJECT_DIR}/include/esp32/tusb_config.h\""

build_unflags = -DARDUINO_USB_MODE=1 -DUSE_ASYNC_WEBSERWER=1

; ========
; ESP32-C3
; ========

[env:esp32c3]
extends = env:multi-esp32-led-strip
board = esp32-c3-devkitm-1
build_flags = 
    ${env:multi-esp32-led-strip.build_flags}
    ${env:esp32-enable-cdc.build_flags}

; ========
; ESP32-S3
; ========

[env:esp32s3]
extends = env:multi-esp32-led-strip
board = esp32-s3-devkitc-1
build_flags = 
    ${env:multi-esp32-led-strip.build_flags}
    ${env:esp32-enable-cdc.build_flags}

; ========
; ESP32-C2
; ========

[env:esp32c2]
extends = env:multi-esp32-led-strip
board = esp32-c2-devkitm-1
build_flags = 
    ${env:multi-esp32-led-strip.build_flags}
    -DRMT_CLK_SRC_DEFAULT=0

; ========
; ESP32-C6
; ========

[env:esp32c6]
extends = env:multi-esp32-led-strip
board = esp32-c6-devkitc-1
build_flags = 
    ${env:multi-esp32-led-strip.build_flags}
    ${env:esp32-enable-cdc.build_flags}

; ========
; ESP32-C5
; ========

[env:esp32c5]
extends = env:multi-esp32-led-strip
board = esp32-c5-devkitc-1
build_flags = 
    ${env:multi-esp32-led-strip.build_flags}
    ${env:esp32-enable-cdc.build_flags}

; ==================================================
; Custom boards
; ==================================================

[env:esp32-GLEDOPTO_GL_C_616WL]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DWEBSERVER_USE_ETHERNET=1
    -DETH_PHY_TYPE=ETH_PHY_LAN8720
    -DETH_PHY_ADDR=1
    -DETH_PHY_MDC=23
    -DETH_CLK_MODE=ETH_CLOCK_GPIO0_IN
    -DGLEDOPTO_GL_C_616WL -DPOWER_RELAY_GPIO=18 -DETH_PHY_MDIO=33 -DETH_PHY_POWER=5

[env:esp32-GLEDOPTO_GL_C_615WL]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DGLEDOPTO_GL_C_615WL -DPOWER_RELAY_GPIO=18

[env:esp32-DOMRAEM_WLE_ADM]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DDOMRAEM_WLE_ADM -DPOWER_RELAY_GPIO=12

[env:esp32-IOTORERO_ETHERNET]
extends = env:esp32
build_flags = 
    ${env:esp32.build_flags}
    -DWEBSERVER_USE_ETHERNET=1
    -DETH_PHY_TYPE=ETH_PHY_LAN8720
    -DETH_PHY_ADDR=1
    -DETH_PHY_MDC=23
    -DETH_PHY_MDIO=18
    -DETH_PHY_POWER=16
    -DIOTORERO_ETHERNET -DPOWER_RELAY_GPIO=2 -DPOWER_RELAY_INVERT -DETH_CLK_MODE=ETH_CLOCK_GPIO17_OUT

; ==================================================
; ESP8266
; ==================================================

[env:esp8266]
platform = espressif8266 @ 4.2.1
board = nodemcuv2
board_build.ldscript = eagle.flash.4m1m.ld

lib_deps = 
    SPI
    ${env.lib_deps}

build_flags = 
    ${env.build_flags}
    -DARDUINO_ARCH_ESP8266
    -DUSE_ASYNC_WEBSERWER=1
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DSERIAL_PORT_LITE

; ==================================================
; RP2040/RP2350 (Raspberry Pi Pico W)
; ==================================================

[env:pico-common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#v1.4.0-gcc14-arduinopico460
board_build.core = earlephilhower
board_build.filesystem_size = 1.0m

build_flags =
    ${env.build_flags}
    -DPICO_STACK_SIZE=8192
    -DUSE_ASYNC_WEBSERWER=1
    -DUSE_PICOLADA
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
    -DUSE_TINYUSB
    "-DCFG_TUSB_CONFIG_FILE=\"${PROJECT_DIR}/include/pico/tusb_config.h\""

; ======
; RP2040
; ======

[env:pico]
extends = env:pico-common
board = rpipicow

build_flags = 
    ${env:pico-common.build_flags}
    -DSERIAL_PORT_LITE

; ======
; RP2350
; ======

[env:pico2]
extends = env:pico-common
board = rpipico2w
